# fourkey_oled 板级配置（nice_nano@2.0.0//zmk / SuperMini nRF52840）
#
# 说明：ZMK main（Zephyr 4.1）下，板名必须带 //zmk 变体构建（见 build.yaml）。
# zmk 变体的板级 defconfig 自带 CONFIG_ZMK_USB=y / CONFIG_ZMK_BLE=y /
# CONFIG_SETTINGS_NVS=y，本文件不再显式声明，保持与开源项目一致的极简风格。

# ---- 显示 ----
# 内置状态屏自带三个 widget（默认均 y）：
#   CONFIG_ZMK_WIDGET_LAYER_STATUS    左下 = 当前图层
#   CONFIG_ZMK_WIDGET_BATTERY_STATUS  右上 = 电池电量
#   CONFIG_ZMK_WIDGET_OUTPUT_STATUS   左上 = USB/BLE 输出状态
CONFIG_ZMK_DISPLAY=y

# 电池电量改为百分比文本（官方 Kconfig，见 app/src/display/widgets/Kconfig）：
# 默认只画 LV_SYMBOL_BATTERY_* 图标；开启后显示 "100%" 这样的数字，
# 插 USB 供电时前面会带 LV_SYMBOL_CHARGE 充电符号。
# 依赖 CONFIG_ZMK_BATTERY_REPORTING=y（板级已启用，日志实测 VDDH 采样正常）。
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# ---- B16 显示挂死修复 ----
# 根因证据链（B12-B15 排障）：LVGL 配置为 LV_Z_MEM_POOL_SYS_HEAP=y，
# 从 k_malloc 系统堆分配，而 HEAP_MEM_POOL_SIZE=0 → lv_malloc 全 NULL → 硬错误；
# 同时主线程栈仅 1024B，LVGL 初始化易栈溢出。
# 修复：给系统堆配内存 + 显示渲染移到独立线程并加大栈 + 主线程栈翻倍。
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=3072
CONFIG_MAIN_STACK_SIZE=2048

# B17：单色屏用 1-bit 颜色深度（16-bit RGB565 渲染缓冲与 mono 帧缓冲
# 不匹配是硬死的主因；已在 Kconfig.defconfig 里按官方 shield 原样补齐
# LV_Z_BITS_PER_PIXEL=1 / LV_Z_VDB_SIZE=64 / LV_Z_MEM_POOL_SIZE=5120）。
CONFIG_LV_COLOR_DEPTH_1=y

# USB CDC 串口日志（overlay 里 cdc_acm_uart0 节点），排障时可抓启动日志。
# 注意：CDC 日志不缓存，需先打开串口再单击 RST 复位才能看到完整启动过程；
# Windows 串口助手会独占 COM 口，抓日志前先关闭。
CONFIG_ZMK_USB_LOGGING=y
