# fourkey_oled 板级配置（nice_nano@2.0.0//zmk / SuperMini nRF52840）
#
# 说明：ZMK main（Zephyr 4.1）下，板名必须带 //zmk 变体构建（见 build.yaml）。
# zmk 变体的板级 defconfig 自带 CONFIG_ZMK_USB=y / CONFIG_ZMK_BLE=y /
# CONFIG_SETTINGS_NVS=y，本文件不再显式声明，保持与开源项目（scottokeebs、
# zmk-config-piano）一致的极简风格。

# ---- 显示 ----
# 内置状态屏自带三个 widget（默认均 y）：
#   CONFIG_ZMK_WIDGET_LAYER_STATUS    左下 = 当前图层
#   CONFIG_ZMK_WIDGET_BATTERY_STATUS  右上 = 电池电量
#   CONFIG_ZMK_WIDGET_OUTPUT_STATUS   左上 = USB/BLE 输出状态
CONFIG_ZMK_DISPLAY=y

# ---- ZMK Studio ----
# 在线改键（替代 QMK VIA；配合 build.yaml 的 studio-rpc-usb-uart snippet）
CONFIG_ZMK_STUDIO=y
