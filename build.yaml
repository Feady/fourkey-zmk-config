# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
# 注意：ZMK main（Zephyr 4.1 / HWMv2）下，板名必须带 zmk 变体（//zmk），
# 否则 CONFIG_ZMK_USB / CONFIG_SETTINGS_NVS 等板级默认不会启用（见
# zmk 博客 2025-12-09-zephyr-4-1.md 的 ZMK Board Variant 一节）。
---
# ZMK Studio 官方配置（docs/features/studio.md）：
#   snippet 提供 RPC 用的 CDC-ACM 串口 + ZMK_BEHAVIORS_KEEP_ALL，
#   但 snippet.conf 不含 ZMK_STUDIO，必须通过 cmake-args 显式开启。
include:
  # B28: 官方 settings_reset shield —— 一次性"清空 NVS"固件。
  # 启动时清空整个 settings 分区（BLE bond / 首选输出 / Studio 改键 / 层顺序），
  # 官方 conf 会关掉 BLE 和显示，防止清完立刻又写回。
  # 刷入后等几秒，**必须再刷回 fourkey_oled 正常固件**（否则每次启动都清空）。
  - board: nice_nano@2.0.0//zmk
    shield: settings_reset

  - board: nice_nano@2.0.0//zmk
    shield: fourkey_oled
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
