# fourkey_oled 板级配置（nice_nano_v2 / SuperMini nRF52840）

# ---- 显示（SSD1306 128x64，显示电量 / 蓝牙层）----
# [B2 诊断] 临时关闭显示，验证键盘/BLE/USB 本体是否正常（屏幕亮乱码+USB枚举失败+无BLE
# 疑似 I2C 大块帧缓冲传输挂起阻塞启动，先禁显示二分定位）
CONFIG_ZMK_DISPLAY=n
# 闲置自动熄屏省电：需要时就取消注释
# CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# ---- 蓝牙（板级已含默认项，这里只留必要补充）----
# [B7 擦除版] 临时关 BLE：真根因是 preferred_transport=2(BLE)，且 RESET_ON_START 反复擦 NVS
# 把 BLE 身份/GATT 数据也擦掉导致 ble_ready=0 → 首选 BLE 又起不来 → 无输出。
# 本版：关 BLE + 擦 NVS 一次，让 preferred 回到编译期默认 USB；擦完再刷回 B8 正常版。
CONFIG_ZMK_BLE=n

# ---- [B5 诊断] 开启 USB CDC 串口日志，抓启动卡点（无调试器时的替代通道）----
CONFIG_ZMK_USB_LOGGING=y

# ---- [B3 诊断] 32k 时钟源改内部 RC ----
# SuperMini 克隆板可能未焊 32.768kHz 晶振：BLE 初始化请求 LFXO 永久等待 → 启动挂起
# （症状：USB 枚举到设备级但接口配置未完成、BLE 不广播、显示初始化后卡死）
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# ---- [B7 擦除版] 一次性擦 NVS settings，清掉残留 preferred_transport=BLE ----
CONFIG_ZMK_SETTINGS_RESET_ON_START=y
