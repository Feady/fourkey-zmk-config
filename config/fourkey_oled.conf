# fourkey_oled 板级配置（nice_nano@2.0.0//zmk / SuperMini nRF52840）
#
# 说明：ZMK main（Zephyr 4.1）下，板名必须带 //zmk 变体构建（见 build.yaml）。
# zmk 变体的板级 defconfig 自带 CONFIG_ZMK_USB=y / CONFIG_ZMK_BLE=y /
# CONFIG_SETTINGS_NVS=y，本文件不再显式声明，保持与开源项目一致的极简风格。

# ---- 显示：B24 混合自定义状态屏 ----
# 用 ZMK 官方自定义屏路径（参考 app/boards/shields/nice_view）：
#   CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y 会让 app/src/display/main.c 的
#   weak zmk_display_status_screen() 被 shields/fourkey_oled/custom_status_screen.c
#   的强实现覆盖；CMakeLists.txt 负责把该 C 文件接入构建。
# 自定义屏自己画顶栏（USB/BLE + 层名 + 电量百分比）、2x2 键位卡片、底部提示，
# 因此不再编译内置三 widget；电量百分比由 zmk_battery_state_of_charge() 直接取。
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# 自定义屏直接用 lv_label_*；切到 custom 后内置 widgets 不再被编译，
# 没有 widget 帮我们 select LV_USE_LABEL，必须显式打开，否则链接期
# undefined reference to `lv_label_create' / `lv_label_set_text'。
CONFIG_LV_USE_LABEL=y
# B27：顶栏 12 -> 10（用户反馈 12px 仍偏大/不够清晰，降一档更协调）
CONFIG_LV_FONT_MONTSERRAT_10=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_USE_THEME_MONO=y
# nice_view 自定义屏官方取值 8192（B23 内置屏用 5120）；
# 自定义屏对象更多，内存池太小会出现空白/截断。
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# ---- B16 显示挂死修复 ----
# 根因证据链（B12-B15 排障）：LVGL 配置为 LV_Z_MEM_POOL_SYS_HEAP=y，
# 从 k_malloc 系统堆分配，而 HEAP_MEM_POOL_SIZE=0 → lv_malloc 全 NULL → 硬错误；
# 同时主线程栈仅 1024B，LVGL 初始化易栈溢出。
# 修复：给系统堆配内存 + 显示渲染移到独立线程并加大栈 + 主线程栈翻倍。
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=3072
CONFIG_MAIN_STACK_SIZE=2048

# B17：单色屏用 1-bit 颜色深度（16-bit RGB565 渲染缓冲与 mono 帧缓冲
# 不匹配是硬死的主因；已在 Kconfig.defconfig 里按官方 shield 原样补齐
# LV_Z_BITS_PER_PIXEL=1 / LV_Z_VDB_SIZE=64 / LV_Z_MEM_POOL_SIZE）。
CONFIG_LV_COLOR_DEPTH_1=y

# ---- B27 BLE 连接稳定性 ----
# 1) 官方明确用于"improve connection stability"的开关：Kconfig 里会把
#    CONFIG_BT_CTLR_PHY_2M 从默认 y 改成 n。2M PHY 在部分 nRF52840 克隆板
#    （本板 SuperMini）上速率高但链路余量小，容易连上后几秒内被主机断开。
#    回到 1M PHY 速率对本键盘完全够用，稳定性显著更好。
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# 2) 反复刷测试固件后 NVS 里可能残留旧 bond/profile。ZMK 默认对"已被占用
#    的 profile"直接拒绝新配对，表现为主机能搜到、连上马上掉。
#    允许同一 MAC 的主机重新配对时覆盖旧密钥（文档原话：allow overwriting
#    previously paired host keys），这是官方给出的 bond 不匹配修复手段。
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# ---- ZMK Studio ----
# 开关由 build.yaml 的 cmake-args: -DCONFIG_ZMK_STUDIO=y 提供（官方写法），
# 同时 build.yaml 的 studio-rpc-usb-uart snippet 提供 RPC 用的 CDC-ACM 串口。
# 这里不重复声明，避免两处配置不一致。
# 自定义屏每 200ms 通过 zmk_keymap_get_layer_binding_at_idx() 读取运行时
# keymap，Studio 在线改键/改名/重排层后屏幕标签自动同步。

# USB CDC 串口日志：默认关闭。
# 关闭原因：snippet 已占用一个 CDC 接口作为 Studio RPC，再加日志 CDC 会
# 枚举出两个 COM 口，Studio 网页选错串口就报
# "Failed to connect to the chosen device"。
# 需要抓启动日志时：本行改 y，并在 overlay 末尾恢复 cdc_acm_uart0 节点 +
# chosen zephyr,console（见 README 第 5 节）；抓完记得改回来。
# CONFIG_ZMK_USB_LOGGING=y
