# fourkey_oled 板级配置（nice_nano_v2 / SuperMini nRF52840）

# ---- 显示（SSD1306 128x64，显示电量 / 蓝牙层）----
# [B2 诊断] 临时关闭显示，验证键盘/BLE/USB 本体是否正常（屏幕亮乱码+USB枚举失败+无BLE
# 疑似 I2C 大块帧缓冲传输挂起阻塞启动，先禁显示二分定位）
CONFIG_ZMK_DISPLAY=n
# 闲置自动熄屏省电：需要时就取消注释
# CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# ---- 蓝牙（板级已含默认项，这里只留必要补充）----
CONFIG_ZMK_BLE=y
